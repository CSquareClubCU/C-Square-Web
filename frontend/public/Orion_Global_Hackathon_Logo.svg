<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D6BFF"/>
      <stop offset="100%" stop-color="#7B45E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="120" height="120" rx="34"
        fill="url(#iconGradient)" filter="url(#shadow)"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="80" y1="58" x2="56" y2="92"/>
    <line x1="80" y1="58" x2="104" y2="92"/>
    <rect x="70" y="34" width="20" height="20" rx="3"/>
    <rect x="42" y="92" width="20" height="20" rx="3"/>
    <rect x="98" y="92" width="20" height="20" rx="3"/>
  </g>

  <text x="170" y="82"
        font-family="Inter, Poppins, Montserrat, Arial, sans-serif"
        font-size="58" font-weight="800" fill="#141826">ORION</text>

  <text x="170" y="132"
        font-family="Inter, Poppins, Montserrat, Arial, sans-serif"
        font-size="33" font-weight="700"
        letter-spacing="3" fill="#2F5EEA">GLOBAL HACKATHON</text>
</svg>
