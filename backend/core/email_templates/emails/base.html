<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}C Square Club{% endblock %}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style type="text/css">
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #F4F4F4; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">

  <!-- Outer wrapper -->
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F4F4F4;">
    <tr>
      <td align="center" style="padding: 40px 16px;">

        <!-- Main card -->
        <table role="presentation" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; width: 100%; background-color: #FFFFFF; border-radius: 16px; overflow: hidden; border: 1px solid #EAEAEA;">

          <!-- ═══ Gradient accent bar ═══ -->
          <tr>
            <td style="height: 3px; background: linear-gradient(to right, #F97316, #A855F7, #3B82F6); font-size: 0; line-height: 0;">&nbsp;</td>
          </tr>

          <!-- ═══ Logo header ═══ -->
          <tr>
            <td style="padding: 32px 40px 0 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align: middle; padding-right: 10px;">
                    <img src="{{ frontend_url }}/logo-black.png" alt="C Square Club" width="32" height="32" style="display: block; width: 32px; height: 32px; object-fit: contain;">
                  </td>
                  <td style="vertical-align: middle;">
                    <span style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 800; color: #111111; letter-spacing: -0.03em; line-height: 1;">C Square<span style="color: #3B82F6;">.</span></span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ═══ Header divider ═══ -->
          <tr>
            <td style="padding: 20px 40px 0 40px;">
              <div style="height: 1px; background-color: #EAEAEA;"></div>
            </td>
          </tr>

          <!-- ═══ Main content ═══ -->
          <tr>
            <td style="padding: 32px 40px 40px 40px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.7; color: #666666;">
              {% block content %}
              {% endblock %}
            </td>
          </tr>

          <!-- ═══ Footer divider ═══ -->
          <tr>
            <td style="padding: 0 40px;">
              <div style="height: 1px; background-color: #EAEAEA;"></div>
            </td>
          </tr>

          <!-- ═══ Footer ═══ -->
          <tr>
            <td style="padding: 28px 40px 20px 40px; background-color: #F8F8F8;">

              <!-- Signature block -->
              <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td>
                    <p style="margin: 0 0 2px 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; color: #111111;">Thanks &amp; Regards,</p>
                    <p style="margin: 0 0 1px 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 800; color: #111111; letter-spacing: -0.02em;">C Square Club</p>
                    <p style="margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; color: #888888;">The Coding &amp; Technical Club of Chandigarh University</p>
                  </td>
                </tr>
              </table>

              <!-- Logos -->
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top: 18px;">
                <tr>
                  <td style="vertical-align: middle; padding-right: 16px;">
                    <img src="{{ frontend_url }}/logo-black.png" alt="C Square Club" width="48" height="48" style="display: block; width: 48px; height: 48px; object-fit: contain;">
                  </td>
                  <td style="vertical-align: middle;">
                    <img src="{{ frontend_url }}/CU%20Logo.gif" alt="Chandigarh University" width="140" style="display: block; width: 140px; height: auto;">
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <div style="height: 1px; background-color: #EAEAEA; margin: 18px 0;"></div>

              <!-- Tagline -->
              <p style="margin: 0 0 12px 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; color: #111111; letter-spacing: 0.15em; text-transform: uppercase;">Learn &bull; Compete &bull; Build</p>

              <!-- Social links row 1 -->
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding-right: 20px;">
                    <a href="https://wa.me/917494947018" style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; color: #555555; text-decoration: none;">&#128222; +91 7494947018</a>
                  </td>
                  <td>
                    <a href="mailto:csquareclub@cumail.in" style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; color: #555555; text-decoration: none;">&#9993; csquareclub@cumail.in</a>
                  </td>
                </tr>
              </table>

              <!-- Social links row 2 -->
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top: 6px;">
                <tr>
                  <td style="padding-right: 20px;">
                    <a href="https://www.linkedin.com/company/csquare-club/" style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; color: #555555; text-decoration: none;">&#128188; csquare-club</a>
                  </td>
                  <td>
                    <a href="https://www.instagram.com/csquare_club/" style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; color: #555555; text-decoration: none;">&#128247; @csquare_club</a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- ═══ Copyright bar ═══ -->
          <tr>
            <td style="padding: 14px 40px 20px 40px; background-color: #F8F8F8; border-top: 1px solid #EAEAEA;">
              <p style="margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; color: #555555; letter-spacing: 0.08em; text-transform: uppercase;">&copy; {% now "Y" %} C Square Club &mdash; Chandigarh University</p>
            </td>
          </tr>

        </table>
        <!-- End main card -->

      </td>
    </tr>
  </table>

</body>
</html>
